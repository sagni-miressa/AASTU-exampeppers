<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AASTU EXAM PAPERS</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- PDF rendering library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-badge">AASTU</span>
      <h1>EXAM PAPERS</h1>
    </div>
    <div class="user-status">
      <span id="accessBadge" class="status-badge locked">🔒 LOCKED</span>
      <button id="unlockBtn" class="btn-primary">Unlock (100 ETB)</button>
    </div>
  </header>

  <!-- Hero / Semester Banner -->
  <section class="banner">
    <h2>Freshman Exam Preparation Portal</h2>
    <p>Access verified midterms, finals, and quizzes in PDF & Image formats.</p>
    
    <div class="semester-tabs">
      <button class="tab-btn active" onclick="switchSemester(1)">Semester 1</button>
      <button class="tab-btn" onclick="switchSemester(2)">Semester 2</button>
    </div>
  </section>

  <!-- Main Course Grid Section -->
  <main class="container">
    <div id="courseGrid" class="course-grid">
      <!-- Courses will be rendered dynamically via JS -->
    </div>
  </main>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('paymentModal')">&times;</span>
      <h3>Unlock Full Access</h3>
      <p>Pay <strong>100 ETB</strong> via Telebirr or Chapa to access all semester papers.</p>

      <div class="payment-methods">
        <label class="pay-option">
          <input type="radio" name="payment" value="telebirr" checked />
          <span>Telebirr</span>
        </label>
        <label class="pay-option">
          <input type="radio" name="payment" value="chapa" />
          <span>Chapa / CBE Birr</span>
        </label>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" placeholder="09xxxxxxxx" />
      </div>

      <button onclick="processPayment()" class="btn-success">Confirm Payment (100 ETB)</button>
    </div>
  </div>

  <!-- Document Viewer Modal (PDF/Images) -->
  <div id="viewerModal" class="modal hidden">
    <div class="modal-content large">
      <span class="close-btn" onclick="closeModal('viewerModal')">&times;</span>
      <h3 id="viewerTitle">Exam Document Viewer</h3>
      
      <div id="viewerBody" class="viewer-body">
        <!-- Content inserted dynamically -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
