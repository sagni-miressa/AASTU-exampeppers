<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AASTU EXAM PAPERS</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="logo-container">
      <span class="logo-badge">AASTU</span>
      <h1>EXAM PAPERS</h1>
    </div>
    <div class="user-status">
      <span id="accessBadge" class="status-badge locked">🔒 LOCKED</span>
      <button id="unlockBtn" class="btn-primary">Unlock All (100 ETB)</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h2>Freshman Exam Portal</h2>
    <p>Access verified midterms, finals, and quizzes across all official AASTU courses.</p>
    
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search course name or code (e.g. ENG101, Math)..." />
      <div class="semester-tabs">
        <button class="tab-btn active" onclick="switchSemester(1)">Semester 1</button>
        <button class="tab-btn" onclick="switchSemester(2)">Semester 2</button>
      </div>
    </div>
  </section>

  <!-- Course Grid -->
  <main class="container">
    <div id="courseGrid" class="course-grid"></div>
  </main>

  <!-- Payment Modal -->
  <div id="paymentModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('paymentModal')">&times;</span>
      <h3>Unlock Full Access</h3>
      <p style="color: var(--text-muted); margin-top: 4px;">Pay <strong>100 ETB</strong> via Telebirr or Chapa to download and view all papers.</p>

      <div class="form-group">
        <label for="phone"><strong>Telebirr / CBE Phone Number:</strong></label>
        <input type="text" id="phone" placeholder="09xxxxxxxx" />
      </div>

      <button onclick="processPayment()" class="btn-success">Confirm 100 ETB Payment</button>
    </div>
  </div>

  <!-- Viewer Modal -->
  <div id="viewerModal" class="modal hidden">
    <div class="modal-content large">
      <span class="close-btn" onclick="closeModal('viewerModal')">&times;</span>
      <h3 id="viewerTitle">Document Viewer</h3>
      <div id="viewerBody"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
